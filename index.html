<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archives de Teyvat - Mode Local Autonome</title>
    <style>
        :root {
            --bg-color: #12131a;
            --card-bg: #1c1d26;
            --modal-bg: #191b24;
            --text-color: #f5f6fa;
            --primary-color: #4a90e2;
            --rarity-5: #e2a84a;
            --rarity-4: #9b51e0;
            --rarity-3: #4ea8de;
            --input-bg: #282a36;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        header { text-align: center; margin-bottom: 20px; }
        h1 { color: var(--primary-color); margin-bottom: 5px; }

        .tabs-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto 20px auto;
        }

        .tab-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 2px solid transparent;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.2s;
        }

        .tab-btn.active {
            border-color: var(--primary-color);
            background-color: var(--input-bg);
        }

        .controls-container {
            max-width: 1200px;
            margin: 0 auto 30px auto;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .search-row { display: flex; gap: 15px; }

        .search-box {
            flex: 1;
            padding: 12px 20px;
            background-color: var(--input-bg);
            border: 2px solid transparent;
            border-radius: 8px;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
        }

        .sort-btn {
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 1px solid #3d4263;
            padding: 0 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .filter-buttons { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; }
        .filter-label { font-size: 0.9rem; color: #8a8f98; font-weight: bold; margin-right: 5px; }
        
        .filter-btn {
            background-color: var(--input-bg);
            color: var(--text-color);
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }
        .filter-btn.active { background-color: var(--primary-color); }

        .item-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Vue talents : cartes plus larges pour lire les descriptions */
        .item-grid.talents-view {
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            text-align: center;
            padding-bottom: 15px;
            border-top: 5px solid transparent;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        .card.stars-5 { border-top-color: var(--rarity-5); }
        .card.stars-4 { border-top-color: var(--rarity-4); }
        .card.stars-3 { border-top-color: var(--rarity-3); }

        .media-container {
            background: radial-gradient(circle, #3a3d52 0%, #171821 100%);
            padding: 15px 0;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100px;
        }

        .item-thumb { width: 85px; height: 85px; object-fit: contain; filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.4)); }
        .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
        }

        /* Styles spécifiques pour l'affichage des attaques */
        .talent-box {
            background: #12131a;
            margin: 10px 15px;
            padding: 10px;
            border-radius: 6px;
            text-align: left;
            border-left: 3px solid var(--primary-color);
        }
        .talent-name {
            font-weight: bold;
            color: var(--rarity-5);
            font-size: 0.95rem;
            margin-bottom: 3px;
        }
        .talent-desc {
            font-size: 0.85rem;
            color: #b9bbbe;
            margin: 0;
            line-height: 1.3;
        }

        /* --- MODALE --- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.open { display: flex; }

        .modal-content {
            background-color: var(--modal-bg);
            width: 90%;
            max-width: 700px;
            max-height: 85vh;
            border-radius: 16px;
            overflow-y: auto;
            position: relative;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #333645;
        }

        .close-modal {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 2rem;
            cursor: pointer;
            color: #aaa;
        }
        .close-modal:hover { color: #fff; }

        .modal-header { display: flex; gap: 20px; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #2d3142; padding-bottom: 20px;}
        .modal-img { width: 100px; height: 100px; background: #12131a; border-radius: 12px; padding: 10px; object-fit: contain;}
        .modal-title h2 { margin: 0; color: var(--primary-color); }
        
        .section-title {
            color: var(--rarity-5);
            border-left: 4px solid var(--rarity-5);
            padding-left: 10px;
            margin: 25px 0 12px 0;
            font-size: 1.2rem;
        }

        .substat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; background: #20222f; padding: 12px; border-radius: 8px; }
    </style>
</head>
<body>

    <header>
        <h1>Archives de Teyvat</h1>
        <p>Base de données Intégrale - Mode Local Autonome</p>
    </header>

    <!-- Ajout de l'onglet Talents ici -->
    <div class="tabs-container">
        <button class="tab-btn active" data-tab="characters">👤 Personnages</button>
        <button class="tab-btn" data-tab="weapons">⚔️ Armes</button>
        <button class="tab-btn" data-tab="talents">✨ Aptitudes</button>
        <button class="tab-btn" data-tab="constellation">✨ Constellation</button>
        <button class="tab-btn" data-tab="artifacts">🧰 Artéfacts</button>
    </div>

    <div class="controls-container">
        <div class="search-row">
            <input type="text" id="searchBox" class="search-box" placeholder="Rechercher par nom...">
            <button class="sort-btn" id="sortAlphaBtn">Tri : A-Z</button>
        </div>
        
        <div class="filter-buttons" id="rarityFilters">
            <span class="filter-label">Rareté :</span>
            <button class="filter-btn active" data-rarity="all">Toutes</button>
            <button class="filter-btn" data-rarity="5">5 Étoiles ★★★★★</button>
            <button class="filter-btn" data-rarity="4">4 Étoiles ★★★★</button>
            <button class="filter-btn" data-rarity="3" id="btnRarity3" style="display: none">3 Étoiles ★★★</button>
        </div>

        <!-- Filtres Éléments (valables pour Personnages ET Talents) -->
        <div class="filter-buttons" id="elementFilters">
            <span class="filter-label">Élément :</span>
            <button class="filter-btn active" data-element="all">Tous</button>
            <button class="filter-btn" data-element="Pyro">Pyro</button>
            <button class="filter-btn" data-element="Hydro">Hydro</button>
            <button class="filter-btn" data-element="Anémo">Anémo</button>
            <button class="filter-btn" data-element="Électro">Électro</button>
            <button class="filter-btn" data-element="Dendro">Dendro</button>
            <button class="filter-btn" data-element="Cryo">Cryo</button>
            <button class="filter-btn" data-element="Géo">Géo</button>
        </div>

        <!-- Filtres Types d'armes (uniquement pour Armes) -->
        <div class="filter-buttons" id="weaponTypeFilters" style="display: none;">
            <span class="filter-label">Type d'arme :</span>
            <button class="filter-btn active" data-weapon-type="all">Tous</button>
            <button class="filter-btn" data-weapon-type="Épée à une main">Épée à une main</button>
            <button class="filter-btn" data-weapon-type="Épée à deux mains">Épée à deux mains</button>
            <button class="filter-btn" data-weapon-type="Arme d'hast">Arme d'hast</button>
            <button class="filter-btn" data-weapon-type="Arc">Arc</button>
            <button class="filter-btn" data-weapon-type="Catalyseur">Catalyseur</button>
        </div>

        <!-- Filtres D'artéfact (uniquement pour les Artéfacts) -->
        <div class="filter-buttons" id="ArtifactFilter" style="display: none;">
        </div>
    </div>

    <main class="item-grid" id="mainGrid"></main>

    <div class="modal" id="detailsModal">
        <div class="modal-content">
            <span class="close-modal" id="closeModal">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="data.js"></script>
    <script>
        let currentTab = 'characters'; // 'characters', 'weapons', ou 'talents'
        let currentElementFilter = 'all';
        let currentWeaponTypeFilter = 'all';
        let currentRarityFilter = 'all'; 
        let currentArtifactFilter = 'all';
        let currentSearchQuery = '';
        let alphaDirection = 'asc'; 

        function render() {
            const grid = document.getElementById('mainGrid');
            grid.innerHTML = '';

            // Ajustement de la largeur de la grille si on est sur l'onglet talents
            if (currentTab === 'talents' || currentTab === 'constellation') {
                grid.classList.add('talents-view');
            } else {
                grid.classList.remove('talents-view');
            }

            // Pour l'onglet "talents", on utilise aussi la liste des personnages
            let dataSource = (currentTab === 'talents' || currentTab === 'constellation') ? 'characters' : currentTab;
            let filtered = [...LOCAL_GENSHIN_DATA[dataSource]];

            // 1. Filtrage Recherche textuelle
            if (currentSearchQuery) {
                filtered = filtered.filter(item => item.name.toLowerCase().includes(currentSearchQuery.toLowerCase()));
            }

            // 2. Filtrage par Rareté
            if (currentRarityFilter !== 'all') {
                filtered = filtered.filter(item => item.rarity === parseInt(currentRarityFilter));
            }

            // 3. Filtrage par Élément (Personnages et Talents)
            if ((currentTab === 'characters' || currentTab === 'talents') && currentElementFilter !== 'all') {
                filtered = filtered.filter(char => char.vision === currentElementFilter);
            }

            // 4. Filtrage par Type d'Arme (Armes)
            if (currentTab === 'weapons' && currentWeaponTypeFilter !== 'all') {
                filtered = filtered.filter(weapon => weapon.type === currentWeaponTypeFilter);
            }

            // 4. Filtrage par Artéfact (Artéfacts)
            if (currentTab === 'artifacts' && currentArtifactFilter !== 'all') {
                filtered = filtered.filter(artifact => artifact.type === currentArtifactFilter);
            }

            // 6. Tri Alphabétique
            filtered.sort((a, b) => {
                return alphaDirection === 'asc' ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name);
            });

            // Affichage des cartes
            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = `card stars-${item.rarity}`;

                if (currentTab === 'characters') {
                    card.innerHTML = `
                        <div class="media-container">
                            <img src="${item.icon}" class="item-thumb" alt="${item.name}">
                            <span class="badge" style="background-color: var(--input-bg)">${item.vision}</span>
                        </div>
                        <h3 style="font-size:1.1rem; margin:10px 0 5px 0;">${item.name}</h3>
                        <div class="details">
                            <p style="margin:0; color:#aaa; font-size:0.9rem;">${item.weapon}</p>
                            <p style="margin:5px 0 0 0; color: var(--rarity-5);">${'★'.repeat(item.rarity)}</p>
                        </div>
                    `;
                    card.addEventListener('click', () => openDetails(item, 'characters'));
                } 
                else if (currentTab === 'weapons') {
                    card.innerHTML = `
                        <div class="media-container">
                            <img src="${item.icon}" class="item-thumb" alt="${item.name}">
                            <span class="badge" style="background-color:#111">${item.type}</span>
                        </div>
                        <h3 style="font-size:1.1rem; margin:10px 0 5px 0;">${item.name}</h3>
                        <div class="details">
                            <p style="margin:5px 0 0 0; color: var(--rarity-5);">${'★'.repeat(item.rarity)}</p>
                        </div>
                    `;
                    card.addEventListener('click', () => openDetails(item, 'weapons'));
                } 
                // --- NOUVEL ONGLET : AFFICHAGE DES TALENTS ET ATTACKS ---
                else if (currentTab === 'talents') {
                    card.innerHTML = `
                        <div class="media-container">
                            <img src="${item.icon}" class="item-thumb" alt="${item.name}">
                            <span class="badge" style="background-color: var(--input-bg)">${item.vision}</span>
                        </div>
                        <h3 style="font-size:1.2rem; margin:10px 0 5px 0; color: var(--primary-color);">${item.name}</h3>
                        
                        <div class="talent-box">
                            <div class="talent-name">⚔️ Attaque Normale : ${item.normale || 'Non renseigné'}</div>
                            <p class="talent-desc">${item.desc || 'Aucune description disponible.'}</p>
                        </div>
                        
                        <div class="talent-box">
                            <div class="talent-name">🌀 Compétence élémentaire (E) : ${item.compétence || 'Non renseigné'}</div>
                            <p class="talent-desc">${item.e || 'Aucune description disponible.'}</p>
                        </div>
                        
                        <div class="talent-box">
                            <div class="talent-name">💥 Déchaînement élémentaire (Q) : ${item.ultime || 'Non renseigné'}</div>
                            <p class="talent-desc">${item.q || 'Aucune description disponible.'}</p>
                        </div>

                        <div class="talent-box">
                            <div class="talent-name">💥 Aptitude d'élévation n°1 : ${item.élévation1 || 'Non renseigné'}</div>
                            <p class="talent-desc">${item.e || 'Aucune description disponible.'}</p>
                        </div>

                        <div class="talent-box">
                            <div class="talent-name">💥 Aptitude d'élévation n°2 : ${item.élévation2 || 'Non renseigné'}</div>
                            <p class="talent-desc">${item.e || 'Aucune description disponible.'}</p>
                        </div>
                        
                        <div class="talent-box">
                            <div class="talent-name">💥 Aptitude passive n°1 : ${item.passive1 || 'Non renseigné'}</div>
                            <p class="talent-desc">${item.e || 'Aucune description disponible.'}</p>
                        </div>
                         <div class="talent-box">
                            <div class="talent-name">💥 Aptitude passive n°2 : ${item.passive2 || 'Non renseigné'}</div>
                            <p class="talent-desc">${item.e || 'Aucune description disponible.'}</p>
                        </div>

                        <div class="talent-box">
                            <div class="talent-name">💥 Aptitude suplémentaire : ${item.supplémentaire || 'Non renseigné'}</div>
                            <p class="talent-desc">${item.e || 'Aucune description disponible.'}</p>
                        </div>

                    `;
                    // On permet quand même d'ouvrir la modale globale au clic
                    card.addEventListener('click', () => openDetails(item, 'characters'));
                }

                else if (currentTab === 'constellation') {
                    card.innerHTML = `
                        <div class="media-container">
                            <img src="${item.icon}" class="item-thumb" alt="${item.name}">
                            <span class="badge" style="background-color: var(--input-bg)">${item.vision}</span>
                        </div>
                        <h3 style="font-size:1.2rem; margin:10px 0 5px 0; color: var(--primary-color);">${item.name}</h3>
        
                        <div class="talent-box">
                            <div class="talent-name">🌟 Constellation Niv.1 : ${item.c1 || 'Non renseigné'}</div>
                            <p class="talent-desc">${item.c1Desc || 'Aucune description disponible.'}</p>
                        </div>
        
                        <div class="talent-box">
                            <div class="talent-name">🌟 Constellation Niv.2 : ${item.c2 || 'Non renseigné'}</div>
                            <p class="talent-desc">${item.c2Desc || 'Aucune description disponible.'}</p>
                        </div>
        
                        <div class="talent-box">
                            <div class="talent-name">🌟 Constellation Niv.3 : ${item.c3 || 'Non renseigné'}</div>
                            <p class="talent-desc">${item.c3Desc || 'Aucune description disponible.'}</p>
                        </div>

                        <div class="talent-box">
                            <div class="talent-name">🌟 Constellation Niv.4 : ${item.c4 || 'Non renseigné'}</div>
                            <p class="talent-desc">${item.c4Desc || 'Aucune description disponible.'}</p>
                        </div>

                        <div class="talent-box">
                            <div class="talent-name">🌟 Constellation Niv.5 : ${item.c5 || 'Non renseigné'}</div>
                            <p class="talent-desc">${item.c5Desc || 'Aucune description disponible.'}</p>
                        </div>
        
                        <div class="talent-box">
                            <div class="talent-name">🌟 Constellation Niv.6 : ${item.c6 || 'Non renseigné'}</div>
                            <p class="talent-desc">${item.c6Desc || 'Aucune description disponible.'}</p>
                        </div>
                    `;
                    // Permet d'ouvrir la modale globale au clic
                    card.addEventListener('click', () => openDetails(item, 'characters'));
                }

                else if (currentTab === 'artifacts') {
                    card.innerHTML = `
                        <div class="media-container">
                            <img src="${item.icon}" class="item-thumb" alt="${item.name}">
                            <span class="badge" style="background-color:#111">${item.type}</span>
                        </div>
                        <h3 style="font-size:1.1rem; margin:10px 0 5px 0;">${item.name}</h3>
                        <div class="details">
                            <p style="margin:5px 0 0 0; color: var(--rarity-5);">${'★'.repeat(item.rarity)}</p>
                        </div>
                    `;
                    card.addEventListener('click', () => openDetails(item, 'artifacts'));
                } 
                grid.appendChild(card);
            });
        }

        function openDetails(item, type) {
            const modal = document.getElementById('detailsModal');
            const body = document.getElementById('modalBody');
            let htmlContent = '';

            if (type === 'characters') {
                htmlContent = `
                    <div class="modal-header">
                        <img src="${item.icon}" class="modal-img">
                        <div class="modal-title">
                            <h2>${item.name}</h2>
                            <p>${'★'.repeat(item.rarity)}</p> | Élément : <strong>${item.vision}</strong></p> | Arme : <strong>${item.weapon}</strong></p> | Élévation : <strong>${item.elevation}</strong></p>
                            <p style="font-style: italic; color: #aaa;">"${item.description || ''}"</p>
                        </div>
                    </div>
                    <div class="section-title">📊 Fiche d'Identité</div>
                    <div class="substat-grid">
                        <div><strong>Région :</strong> ${item.nation || 'Inconnue'}</div>
                        <div><strong>Affiliation :</strong> ${item.affiliation || 'Aucune'}</div>
                        <div><strong>Constellation :</strong> ${item.constellation || 'Inconnue'}</div>
                        <div><strong>Anniversaire :</strong> ${item.anniversaire || 'Inconnu'}</div>
                    </div>
                `;
            } else if (type === ' weapons') {
                htmlContent = `
                    <div class="modal-header">
                        <img src="${item.icon}" class="modal-img">
                        <div class="modal-title">
                            <h2>${item.name}</h2>
                            <p>${'★'.repeat(item.rarity)}</p> || Catégorie : <strong>${item.type}</strong></p> || Statistique principale : <strong>${item.main}</strong></p> || Statistique secondaire : <strong>${item.sub}</strong></p>
                        </div>
                    </div>
                    <div class="section-title">📊 Propriétés Légendaires</div>
                    <div class="substat-grid">
                        <div><strong>Rareté :</strong> ${item.rarity} Étoiles</div>
                        <div><strong>Disponibilité :</strong> ${item.location || 'Inconnue'}</div>
                    </div>
                    <div class="section-title">📊 Description</div>
                    <div class="substat-grid">
                        <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 8px;" class="weapon-effect-box">
                        <div class="talent-name">${item.name || 'Non renseigné'}</div>
                        <p class="talent-desc">${item.effect || 'Aucune description disponible.'}</p>
                    </div>

                `;
            } else {
                htmlContent = `
                    <div class="modal-header">
                        <img src="${item.icon}" class="modal-img">
                        <div class="modal-title">
                            <h2>${item.name}</h2>
                            <p>${'★'.repeat(item.rarity)}</p> | Catégorie : <strong>${item.type}</strong></p>
                        </div>
                    </div>
                    <div class="section-title">📊 Propriétés Légendaires</div>
                    <div class="substat-grid">
                        <div><strong>Rareté :</strong> ${item.rarity} Étoiles</div>
                        <div><strong>Disponibilité :</strong> ${item.location || 'Inconnue'}</div>
                    </div>
                    <div class="section-title">📊 Description</div>
                    <div class="substat-grid">
                        <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 8px;" class="weapon-effect-box">
                        <div class="talent-name">${item.names || 'Non renseigné'}</div>
                        <p class="talent-desc">${item.effect || 'Aucune description disponible.'}</p>
                    </div>

                `;
            }

            body.innerHTML = htmlContent;
            modal.classList.add('open');
        }

        function resetFilters() {
            currentElementFilter = 'all';
            currentWeaponTypeFilter = 'all';
            currentRarityFilter = 'all';
            currentArtifactFilter = 'all';
            currentSearchQuery = '';
            document.getElementById('searchBox').value = '';

            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.getAttribute('data-element') === 'all' || 
                    btn.getAttribute('data-weapon-type') === 'all' || 
                    btn.getAttribute('data-rarity') === 'all') {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        function setupControls() {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
                    e.target.classList.add('active');
                    currentTab = e.target.getAttribute('data-tab');
                    
                    // Ajustement des barres de filtres selon l'onglet
                    if (currentTab === 'characters' || currentTab === 'talents' || currentTab === 'constellation') {
                        document.getElementById('elementFilters').style.display = 'flex';
                        document.getElementById('weaponTypeFilters').style.display = 'none';
                        document.getElementById('ArtifactFilter').style.dispay = 'none';    
                    }else if (currentTab === 'weapons') {
                        document.getElementById('elementFilters').style.display = 'none';
                        document.getElementById('weaponTypeFilters').style.display = 'flex';
                        document.getElementById('ArtifactFilter').style.dispay = 'none';

                    }else if (currentTab === 'artifacts') {
                        document.getElementById('elementFilters').style.display = 'none';
                        document.getElementById('weaponTypeFilters').style.display = 'none';
                        document.getElementById('ArtifactFilter').style.dispay = 'flex';

                    }else {
                        document.getElementById('elementFilters').style.display = 'none';
                        document.getElementById('weaponTypeFilters').style.display = 'none';
                        document.getElementById('ArtifactFilter').style.dispay = 'none';
                    }                    

                    if (currentTab === 'weapons') {
                        document.getElementById('btnRarity3').style.display = 'inline-block';
                    } else {
                        document.getElementById('btnRarity3').style.display = 'none';
                    }
                    
                    resetFilters();
                    render();
                });
            });

            document.getElementById('searchBox').addEventListener('input', (e) => {
                currentSearchQuery = e.target.value;
                render();
            });

            const sortAlphaBtn = document.getElementById('sortAlphaBtn');
            sortAlphaBtn.addEventListener('click', () => {
                alphaDirection = (alphaDirection === 'asc') ? 'desc' : 'asc';
                sortAlphaBtn.innerText = `Tri : ${alphaDirection === 'asc' ? 'A-Z' : 'Z-A'}`;
                render();
            });

            document.querySelectorAll('#rarityFilters .filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('#rarityFilters .filter-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentRarityFilter = e.target.getAttribute('data-rarity');
                    render();
                });
            });

            document.querySelectorAll('#elementFilters .filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('#elementFilters .filter-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentElementFilter = e.target.getAttribute('data-element');
                    render();
                });
            });

            document.querySelectorAll('#weaponTypeFilters .filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('#weaponTypeFilters .filter-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentWeaponTypeFilter = e.target.getAttribute('data-weapon-type');
                    render();
                });
            });

            document.querySelectorAll('#ArtifactFilter .filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('#ArtifactFilter .filter-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    render();
                });
            });

            document.getElementById('closeModal').addEventListener('click', () => {
                document.getElementById('detailsModal').classList.remove('open');
            });
            window.addEventListener('click', (e) => {
                const modal = document.getElementById('detailsModal');
                if (e.target === modal) modal.classList.remove('open');
            });
        }

        setupControls();
        render();
    </script>
</body>
</html>
